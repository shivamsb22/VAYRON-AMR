/**:
  ros__parameters:
    use_sim_time: false

vayron_camera:
  ros__parameters:
    video_device: "/dev/video0"
    camera_frame_id: "camera_optical_frame"
    image_size: [640, 480]
    time_per_frame: [1, 30]
    pixel_format: "YUYV"

vayron_lidar:
  ros__parameters:
    serial_port: "/dev/ttyUSB0"
    serial_baudrate: 115200
    frame_id: "rplidar_link"
