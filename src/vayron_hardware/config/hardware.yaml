vayron_serial_bridge:
  ros__parameters:
    port: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
    baud_rate: 115200

    wheel_separation: 0.15018
    wheel_radius: 0.033

    max_linear_speed: 0.25
    cmd_vel_topic: "/cmd_vel_safe"

    command_timeout: 0.5
    reconnect_interval: 2.0

    publish_odom: true
